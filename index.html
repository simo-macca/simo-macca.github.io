    <!-- Theme: values are updated at runtime by src/stores/theme.js -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash of the wrong theme.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('theme')
        } catch (e) {}
        if (stored !== 'dark' && stored !== 'light') stored = null
        var isDark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', isDark)
        document.querySelector('meta[name="color-scheme"]').content = stored || 'light dark'
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#0b0f17' : '#f8fafc'
      })()
    </script>
